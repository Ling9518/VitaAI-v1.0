# Jasypt 加密主密码（唯一需要设置的环境变量）
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}

spring:
  application:
    name: vitaai

  datasource:
    url: jdbc:mysql://localhost:3306/smart_hospital?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ENC(CjFIa7Ft7llXVOogt6PAm4YUge0QIrPmDkINW98TvElNZa7n9SzB19aGW6X8hTC2)
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  mail:
    host: smtp.qq.com
    port: 587
    username: ENC(dAX45dQ5w75m4ahwYX9vDJWE1596F1j0bQDqSu9ExXzHYSCNQDLQJntABYE6c/5S)
    password: ENC(G9aRgrod3z23EzLUmyd3POvzwyqHCZIrPV/rE2V6DquoqEA595sRpRO76QhD9tgZ)
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.ssl.trust: smtp.qq.com

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

